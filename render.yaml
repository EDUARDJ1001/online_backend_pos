# Blueprint de Render: backend de facturación para las terminales POS independientes.
# Los valores secretos (sync: false) se completan en el panel de Render al crear el servicio.
services:
  - type: web
    name: facturacion-pos-backend
    runtime: node
    plan: starter
    region: oregon
    # NODE_ENV=production haría que npm omita TypeScript; se incluye para compilar.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      # Render pone un proxy delante: así se lee la IP real del cliente.
      - key: TRUST_PROXY
        value: "1"
      # La app POS no envía Origin (es nativa); esto solo aplica a navegadores.
      - key: FRONTEND_URL
        value: http://localhost:3000
      - key: DB_CLIENT
        value: mysql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_SSL_MODE
        value: REQUIRED
      # Sube el ca.pem de Aiven como "Secret File" con el nombre ca.pem.
      - key: DB_SSL_CA_PATH
        value: /etc/secrets/ca.pem
      # La base ya existe y la actualiza el sistema principal.
      - key: DB_AUTO_MIGRATE
        value: "false"
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_TTL
        value: 15m
      - key: REFRESH_TOKEN_TTL
        value: 7d
